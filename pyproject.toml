[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-arima"
version = "0.2.0"
description = "ARIMA forecasting of 1-minute NIFTY 50 prices, benchmarked against persistence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Apoorv Singh" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "ruff>=0.7.1,<0.18",
]

[tool.setuptools]
py-modules = ["nifty_arima"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".repo", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"TIMESERIES_NIFTY.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nifty_arima"]

[tool.coverage.report]
show_missing = true
